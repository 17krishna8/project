openapi: 3.0.3
info:
  title: E-Commerce Store & Inventory API
  version: 1.5.0
  description: >-
    Production E-Commerce API specification covering products inventory,
    order checkout processing, dynamic categories, and real-time status transitions.
servers:
  - url: http://127.0.0.1:3000
    description: MockForge Dummy Gateway Server
  - url: http://127.0.0.1:8085
    description: Standalone Real Production Backend

paths:
  /:
    get:
      summary: Service discovery & API gateway root
      operationId: getApiRoot
      tags:
        - System
      responses:
        "200":
          description: MockForge API Gateway status and service discovery links
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "MockForge Dummy Gateway - E-Commerce Store API"
                  status:
                    type: string
                    example: "online"
                  version:
                    type: string
                    example: "1.5.0"
                  dashboard:
                    type: string
                    example: "/__ui"
                  frontendTestClient:
                    type: string
                    example: "http://127.0.0.1:5175"
                  endpoints:
                    type: array
                    items:
                      type: string
                    example:
                      - "/products"
                      - "/orders"
                      - "/__health"
                      - "/__ui"

  /products:
    get:
      summary: List all products in catalog
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [electronics, apparel, audio, computing]
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Array of catalog products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      summary: Create a new product item
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      summary: Get product details by ID
      operationId: getProduct
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    put:
      summary: Replace or update product stock & pricing
      operationId: updateProduct
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Updated product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

    delete:
      summary: Remove a product from catalog
      operationId: deleteProduct
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product deleted successfully

  /orders:
    get:
      summary: List all orders with customer details
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
      responses:
        '200':
          description: List of placed orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      summary: Place a new customer order
      operationId: createOrder
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      summary: Get order details by ID
      operationId: getOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

    patch:
      summary: Update order status transition (e.g. pending -> shipped)
      operationId: patchOrderStatus
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
      responses:
        '200':
          description: Updated order with new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    delete:
      summary: Cancel an order
      operationId: cancelOrder
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Order cancelled successfully

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
        - stock
      properties:
        id:
          type: string
          example: prod_8xK19q
        name:
          type: string
          example: Ultra-Wide 4K Gaming Monitor 144Hz
        category:
          type: string
          enum: [electronics, apparel, audio, computing]
          example: computing
        price:
          type: number
          format: float
          minimum: 1.00
          example: 499.99
        stock:
          type: integer
          minimum: 0
          example: 42
        rating:
          type: number
          format: float
          minimum: 1.0
          maximum: 5.0
          example: 4.8
        createdAt:
          type: string
          format: date-time
          example: '2026-09-30T14:20:00.000Z'

    ProductInput:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          example: Wireless Noise-Cancelling Headphones
        category:
          type: string
          enum: [electronics, apparel, audio, computing]
          example: audio
        price:
          type: number
          format: float
          minimum: 1.00
          example: 199.50
        stock:
          type: integer
          minimum: 0
          default: 10
          example: 25

    Order:
      type: object
      required:
        - id
        - customerName
        - customerEmail
        - totalAmount
        - status
        - itemsCount
      properties:
        id:
          type: string
          example: ord_91JvL2
        customerName:
          type: string
          example: Aarav Sundaram
        customerEmail:
          type: string
          format: email
          example: aarav.sundaram@techindia.org
        totalAmount:
          type: number
          format: float
          example: 699.49
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
          example: processing
        itemsCount:
          type: integer
          minimum: 1
          example: 3
        shippingCity:
          type: string
          example: Bengaluru
        createdAt:
          type: string
          format: date-time
          example: '2026-09-30T16:45:00.000Z'

    OrderInput:
      type: object
      required:
        - customerName
        - customerEmail
        - totalAmount
      properties:
        customerName:
          type: string
          example: Meera Krishnan
        customerEmail:
          type: string
          format: email
          example: meera.k@bangalore-dev.in
        totalAmount:
          type: number
          format: float
          example: 349.00
        itemsCount:
          type: integer
          minimum: 1
          default: 1
          example: 2
        shippingCity:
          type: string
          default: Mumbai
          example: Mumbai
        status:
          type: string
          enum: [pending, processing, shipped, delivered]
          default: pending
          example: pending
