openapi: 3.0.3
info:
  title: Users API
  version: 1.2.0
  description: Fixture for semantic-data and CRUD suites.
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, blocked]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: A page of users
          headers:
            X-Total-Count:
              description: Total number of records in the session
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
    get:
      operationId: getUser
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Unknown id
    put:
      operationId: replaceUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 60
                status:
                  type: string
                  enum: [active, blocked]
                balance:
                  type: number
                  minimum: 0
                age:
                  type: integer
                  minimum: 18
                  maximum: 65
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: deleteUser
      responses:
        '204':
          description: Deleted
components:
  schemas:
    User:
      type: object
      required: [id, name, email, phone, status, balance, createdAt]
      properties:
        id:
          type: string
          pattern: '^usr_[A-Za-z0-9]{6,12}$'
        name:
          type: string
          minLength: 2
          maxLength: 60
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^(\+91)?[6-9]\d{9}$'
          description: Indian mobile number
        status:
          type: string
          enum: [active, blocked]
        balance:
          type: number
          minimum: 0
          description: INR amount with 2 decimals
        age:
          type: integer
          minimum: 18
          maximum: 65
        postalCode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
        createdAt:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [name, email]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        name:
          type: string
          minLength: 2
          maxLength: 60
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^(\+91)?[6-9]\d{9}$'
        status:
          type: string
          enum: [active, blocked]
        balance:
          type: number
          minimum: 0
        age:
          type: integer
          minimum: 18
          maximum: 65
        postalCode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
