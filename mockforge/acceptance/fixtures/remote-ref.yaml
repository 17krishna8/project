openapi: 3.0.3
info:
  title: Remote Ref API
  version: 1.0.0
  description: Contains a remote $ref, which MockForge must reject.
paths:
  /things:
    get:
      operationId: listThings
      responses:
        '200':
          description: Things
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'https://example.com/schemas/thing.yaml#/Thing'
