swagger: '2.0'
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: A page of pets
          headers:
            X-Total-Count:
              description: Total number of records in the session
              type: integer
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
    post:
      operationId: createPet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/PetCreate'
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/Pet'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    get:
      operationId: getPet
      responses:
        '200':
          description: A pet
          schema:
            $ref: '#/definitions/Pet'
        '404':
          description: Unknown id
    put:
      operationId: replacePet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/PetCreate'
      responses:
        '200':
          description: Replaced
          schema:
            $ref: '#/definitions/Pet'
    patch:
      operationId: updatePet
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [available, pending, sold]
      responses:
        '200':
          description: Updated
          schema:
            $ref: '#/definitions/Pet'
    delete:
      operationId: deletePet
      responses:
        '204':
          description: Deleted
definitions:
  Pet:
    type: object
    required: [id, name, tag, status]
    properties:
      id:
        type: string
        pattern: '^pet_[A-Za-z0-9]{6,10}$'
      name:
        type: string
        minLength: 1
        maxLength: 40
      tag:
        type: string
        enum: [dog, cat, bird]
      status:
        type: string
        enum: [available, pending, sold]
      birthDate:
        type: string
        format: date
      vaccinated:
        type: boolean
      weightKg:
        type: number
        minimum: 0.1
        maximum: 60
  PetCreate:
    type: object
    required: [name, tag]
    properties:
      id:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
      name:
        type: string
        minLength: 1
        maxLength: 40
      tag:
        type: string
        enum: [dog, cat, bird]
      status:
        type: string
        enum: [available, pending, sold]
      birthDate:
        type: string
        format: date
      vaccinated:
        type: boolean
      weightKg:
        type: number
        minimum: 0.1
        maximum: 60
