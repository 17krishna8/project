name: acceptance

on:
  push:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Acceptance suites up to PHASE_CURRENT
        run: npm run acceptance
      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: acceptance/logs/
